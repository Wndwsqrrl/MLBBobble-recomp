# Settings for bobbleheadpros, read from the folder the executable is in.
# Command-line flags override these, e.g. --readback_resolve=none

# NOTE: game_data_root canNOT be set here (the engine reads it before this file
# loads). Launch via "Play MLB Bobblehead Pros.bat" which passes it on the
# command line, or run with --game_data_root=... yourself.

# Full XBLA license instead of the trial.
license_mask = 1

# NVIDIA's default RTV render path leaves the menus/gameplay black on this GPU;
# the ROV (rasterizer-ordered-views) path renders them correctly.
render_target_path_d3d12 = "rov"

# Enable keyboard-as-controller so the game is playable without a gamepad.
# Keys: Start = Enter, A = Space, B = Backspace, X = L, Y = P,
# move/left-stick = W A S D, D-pad = Shift+Arrows, Back = Z/Tab.
mnk_mode = true

# Host-side resolution (like the 3on3 recomp): sets the output window AND the
# guest video mode to a preset. Native panel here is 1080p; set a HIGHER preset
# (1440p / 4k) to render above native and downsample for a sharper image (the
# host-side equivalent of guest supersampling). Presets: 720p, 1080p, 1440p, 4k,
# or an explicit WxH like 2560x1440. Requires restart.
resolution = "1080p"

# NOTE: this game is FRAME-LOCKED to the guest vblank, so raising
# video_mode_refresh_rate above 60 runs the game too fast (165 -> ~2.75x speed,
# confirmed). Leave it at the 60 default. A 165Hz display still presents the
# 60fps output smoothly via vsync; the game logic itself can't exceed 60fps.
